<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- The logo's tile (spec 006 #30), from `ui/static/`: the .ico for what
		     cannot read SVG, the SVG for everything else, and the 180 px PNG a
		     phone puts on its home screen. -->
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="32x32" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<title>Tracepad</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!-- `display: contents` keeps SvelteKit's mount point out of the layout,
		     so the shell's full-height flex column measures against <body>. -->
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
