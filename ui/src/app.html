<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- An empty data URL rather than a file: there is no mark yet, and this
		     keeps the browser from asking the server for /favicon.ico. -->
		<link rel="icon" href="data:," />
		<title>Tracepad</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!-- `display: contents` keeps SvelteKit's mount point out of the layout,
		     so the shell's full-height flex column measures against <body>. -->
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
