name: Feature request
description: Something Tracepad does not do, and what you would use it for.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Tracepad is deliberately small: one binary, one file, sized for a team's
        traces. Start from what you are trying to do; the design can follow.
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
      description: The situation, not the solution. What did you look for, and what did you do instead?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: If you already have a shape in mind, say so — the API, the command, the screen.
  - type: textarea
    id: alternatives
    attributes:
      label: What did you consider instead?
      description: Other tools, a script, a workaround, and why it is not enough.
