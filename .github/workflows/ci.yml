name: CI

# Pull requests carry the gate. A push to `main` is a squash-merge of a pull
# request that already went green on the same tree, so running everything
# again there paid a second time for the same answer — roughly half of every
# month's minutes. The push trigger stays for one job only: the multi-arch
# image build, which needs a run per merge, not per review (see `multiarch`).
on:
  push:
    branches: [main]
  pull_request:

# A push to a pull-request branch makes the run already going for its previous
# head obsolete — the review will look at the new one — so the newer run
# cancels the older instead of both finishing. The group is the pull request's
# number rather than its branch name, which two forks can share and so cancel
# each other's runs (spec 020 #19). A push to `main` has no number, and `ref`
# stands in for it, so two merges in quick succession share a group too and the
# older build is cancelled as well: the newer tree contains the older one, and
# the multi-arch build of the newer is the answer that matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The uv the Python package is tested with, the same one its release builds
# with. Dependabot does not move it; spec 020 #19 lists the pins moved by hand.
env:
  UV_VERSION: "0.11.12"

jobs:
  gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # The gate type-checks and unit-tests the web interface too (spec 006
      # #10). Only the interface needs Node: `go test ./...` on its own does
      # not, and the tagless build the Go half compiles carries no bundle.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ui/package.json
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: make gate
      # The lock files resolve to the npm registry only, over https, with
      # integrity hashes, and under the names they claim (spec 020 #19). The
      # Node package's one alias is its OpenTelemetry 1.x test double. The
      # linter is the interface's dev dependency, installed from its lock by
      # `make gate` above rather than resolved afresh on every run.
      - name: The lock files resolve where they claim to
        run: |
          lint=(ui/node_modules/.bin/lockfile-lint --type npm --allowed-hosts npm
                --validate-https --validate-integrity --validate-package-names)
          "${lint[@]}" --path ui/package-lock.json
          "${lint[@]}" --path sdk/js/package-lock.json \
            --allowed-package-name-aliases sdk-trace-base-v1:@opentelemetry/sdk-trace-base
      # The anchor checker against its own fixture (spec 026 #6, #13).
      # `gate` above runs it over the tree; this run is what says the
      # checker still finds a broken anchor at all: two of the fixture's
      # links must be reported and the four traps beside them must not.
      - run: make doc-anchors-self-test
      # A signal, not a rule (design §8): the interface's application half has
      # a line budget, and crossing it is a prompt to revise rather than a
      # failed build. Its tests are counted beside it under no budget at all
      # (spec 010 #7).
      - run: make ui-lines

  # The web interface against the real binary (spec 006 #10): the embed, the
  # SPA fallback and the pre-authed URL only break at a seam the unit layer
  # cannot see. Its own job, because browser automation does not fit the
  # gate's 30-second budget.
  e2e:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ui/package.json
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npx playwright install --with-deps chromium
        working-directory: ui
      - run: make e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-traces
          path: ui/test-results/
          retention-days: 7

  # The image (spec 020 #7). A Dockerfile that nothing builds rots the day a
  # base image or a Makefile target moves — and the build is not the proof: an
  # image that builds and then exits on start because /data is not writable is
  # the failure this job exists for, and the one a release would otherwise be
  # the first to find. Needs neither Go nor Node on the runner: both halves are
  # built inside the image, which is the point of the Dockerfile being the
  # whole recipe (#1).
  docker:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: make image VERSION=ci
      # Boots it on an ephemeral volume, waits for the container's own
      # HEALTHCHECK, and asserts the version, the uid, the volume and the
      # licence files. Single-arch, because a runner can only run its own.
      - run: make image-check VERSION=ci

  # Build-only, and once per merge: what can break the release's multi-arch
  # manifest is a stage that does not cross-compile, and building both
  # architectures is what catches that. Booting them is not on offer here and
  # is not what this job is for. It runs on `main` rather than on the pull
  # request because the emulated arm64 half is the slowest thing in this file
  # and the answer it gives changes with the Dockerfile and the toolchains,
  # not with the code under review — `docker` above already proves the
  # Dockerfile builds and the image boots, on the runner's own architecture,
  # for every pull request. A merge that breaks the cross-compile is caught
  # here before a tag would find it in `release-server.yml`.
  #
  # `setup-buildx-action` brings up a fresh builder with an empty cache, so
  # without the GitHub Actions cache this job redoes `npm ci`, Vite and both Go
  # builds from nothing on every merge. `push: false` builds and keeps nothing
  # but that cache.
  multiarch:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: The Dockerfile builds for both release architectures
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          # No provenance and no build record: both carry the event's payload,
          # and this build publishes nothing to attest (spec 020 #19).
          provenance: false
          build-args: VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false

  # Real instrumentation against a real binary: the drift detector for SDK
  # attribute conventions (spec 002, Testing #3). Separate from the gate so
  # that a network hiccup installing SDKs never blocks a code review.
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      # The fifth exporter is the Node package, built from this checkout
      # (spec 032 #11).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/js/package-lock.json
      - run: pip install -r scripts/smoke/requirements.txt -e ./sdk/python
      - run: SMOKE_PYTHON="$(which python)" scripts/smoke/run.sh

  # The Python package (spec 017 #12): its unit suite on both ends of the
  # supported range — 3.10 is the floor and the newest is where the OTel SDK
  # moves first — and its end-to-end suite against a real binary. OpenTelemetry
  # on both ends too (spec 042 #14): the floor `pyproject.toml` admits, on the
  # oldest Python, and what `uv.lock` holds — kept current by Dependabot — on
  # both (spec 017 #20). Its own job, because the gate needs neither Python nor
  # a network.
  sdk:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            otel: floor
          - python-version: "3.10"
            otel: locked
          - python-version: "3.13"
            otel: locked
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
      # Each leg is one resolution (spec 042 #16): the lock, whole, or the
      # package with the floor's pins in it. Installing the lock first and the
      # floor over it would leave whatever only the newer OpenTelemetry pulls
      # in behind, and a broken floor could pass on it.
      - if: matrix.otel == 'locked'
        run: uv sync --locked
        working-directory: sdk/python
      - if: matrix.otel == 'floor'
        run: |
          pins="$(scripts/sdk-test.sh --floor-pins)"
          mapfile -t floor <<< "$pins"
          uv venv sdk/python/.venv
          uv pip install --python sdk/python/.venv/bin/python -e sdk/python \
            --group sdk/python/pyproject.toml:dev "${floor[@]}"
      # One rule set for every Python file in the repository, named rather
      # than discovered: the scripts sit outside the package that configures it.
      - run: sdk/python/.venv/bin/ruff check --config sdk/python/pyproject.toml sdk/python scripts
      - run: SDK_PYTHON="$PWD/sdk/python/.venv/bin/python" scripts/sdk-test.sh
      # A signal, not a rule (design §8), the same instrument the interface has.
      - run: make sdk-lines

  # The Go package (spec 033 #11): vet and unit tests inside the nested
  # module on the two newest Go lines — two Gos like two Pythons — then its
  # end-to-end package against a real binary. The binary is built with the
  # server's own Go first, because the root module asks for a newer one than
  # the package's floor; the package is then tested with the matrix's.
  sdk-go:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.26.x", "1.27.x"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go build -o /tmp/tracepad ./cmd/tracepad
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: sdk/go/go.sum
      - run: TRACEPAD_BINARY=/tmp/tracepad scripts/sdk-go-test.sh
      # A signal, not a rule (design §8), the same instrument the others have.
      - run: make sdk-go-lines

  # The Node package (spec 032 #11): its type check and unit suite on both
  # ends of the supported range — 20 is the floor and 22 is where the OTel
  # SDK moves first — and its end-to-end suite against a real binary. Its own
  # job, like the Python one, because the gate needs neither.
  sdk-js:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: sdk/js/package-lock.json
      - run: npm ci
        working-directory: sdk/js
      - run: scripts/sdk-js-test.sh
      # The package must build — the dual output and the declarations are
      # what `npm publish` ships, and nothing else in the suite runs tsup.
      - run: npm run build
        working-directory: sdk/js
      # A signal, not a rule (design §8), the same instrument the others have.
      - run: make sdk-js-lines
