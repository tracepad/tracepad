name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The gate type-checks and unit-tests the web interface too (spec 006
      # #10). Only the interface needs Node: `go test ./...` on its own does
      # not, and the tagless build the Go half compiles carries no bundle.
      - uses: actions/setup-node@v4
        with:
          node-version-file: ui/package.json
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: make precommit
      # A signal, not a rule (design §8): the interface has a line budget, and
      # crossing it is a prompt to revise rather than a failed build.
      - run: make ui-lines

  # Real instrumentation against a real binary: the drift detector for SDK
  # attribute conventions (spec 002, Testing #3). Separate from the gate so
  # that a network hiccup installing SDKs never blocks a code review.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r scripts/smoke/requirements.txt
      - run: SMOKE_PYTHON="$(which python)" scripts/smoke/run.sh
