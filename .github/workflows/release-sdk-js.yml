# Publishing the Node package (spec 032 #11).
#
# The tag is the trigger and the version is the package's own: `sdk-js/v0.2.0`
# releases what `sdk/js/package.json` calls 0.2.0, and a tag that says
# anything else fails before a build happens — a version on npm cannot be
# taken back.
# The version is read from the tag that triggered the run (`GITHUB_REF_NAME`),
# never from `git describe`: a commit may carry the server's tag and the other
# packages' beside this one (spec 020 #28).
#
# Credentials: none. npm trusted publishing exchanges this workflow's OIDC
# token for a publish token, so there is no token in the repository to leak
# or to rotate, and `--provenance` attaches the build's attestation to the
# version. The trusted publisher (owner `tracepad`, repository `tracepad`,
# workflow `release-sdk-js.yml`, environment `npm`) is configured once on
# npmjs.com by the package's owner.
#
# Two jobs, and only the second can mint that token (spec 032 #18): `build`
# installs from the lock file, tests and packs with read access alone, and
# `publish` receives the tarball it made and uploads it with lifecycle scripts
# off — it runs no code of the package's and installs nothing but a pinned npm.
name: Release the Node package

on:
  push:
    tags: ["sdk-js/v*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
          package-manager-cache: false # a release restores no cache another run could have written

      - name: The tag and the package must agree about the version
        run: scripts/sdk-js-release-check.sh "$GITHUB_REF_NAME"

      # The suite runs here too. CI ran it on the commit, but a tag can be
      # moved, and what is published must be what passed.
      - run: npm ci
        working-directory: sdk/js
      - run: SDK_SKIP_E2E=1 scripts/sdk-js-test.sh

      # `prepack` builds `dist`; `files` in package.json ships it and NOTICE, and
      # npm adds LICENSE and the README on its own.
      - run: mkdir -p "$RUNNER_TEMP/package" && npm pack --pack-destination "$RUNNER_TEMP/package"
        working-directory: sdk/js
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write # trusted publishing and the provenance npm attaches
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
          package-manager-cache: false # a release restores no cache another run could have written
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5 or newer, which the runner's Node
      # may or may not bundle; one exact version rather than `latest`.
      - run: npm install -g npm@11.20.0 # zizmor: ignore[adhoc-packages] -- npm itself, one exact version
      # A version with a hyphen is a pre-release (`0.1.0-rc.1`), and npm 11
      # refuses to publish one without a tag: "You must specify a tag using
      # --tag when publishing a prerelease version". `next` keeps it off
      # `latest`, which `npm install tracepad` follows; a release goes to
      # `latest` as before. Read from the tarball being published, the same
      # one `build` made from the version the tag was checked against.
      - name: The dist-tag this version goes under
        id: tag
        run: |
          version="$(tar -xzOf package/*.tgz package/package.json | jq -r .version)"
          case "$version" in
            *-*) echo "tag=next" >> "$GITHUB_OUTPUT" ;;
            *) echo "tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "publishing $version"
      # `./`, because npm reads `package/tracepad-0.1.0.tgz` as the GitHub
      # shorthand `owner/repo` and goes to ssh://git@github.com for it; a path
      # is a path only when it starts like one (spec 020 #28).
      - run: npm publish ./package/*.tgz --provenance --access public --ignore-scripts --tag "$DIST_TAG"
        env:
          DIST_TAG: ${{ steps.tag.outputs.tag }}
