# Releasing the server (spec 020 #5). A version tag publishes two things, and
# each tool does the one it is good at: GoReleaser owns the six archives and
# their checksums on GitHub Releases, `buildx` owns one multi-arch manifest on
# GHCR. The image is not built by GoReleaser — its Docker support wants a
# prebuilt binary copied into a per-architecture Dockerfile, which is the shape
# Decision 1 refuses: the Dockerfile in this repository is the whole recipe, so
# that a contributor, a fork or an operator with a patch can build the artifact
# the docs describe.
#
# Credentials: the release and the image are published with the repository's
# own token, and their provenance is signed through the workflow's OIDC
# identity (#19). The one credential that is ours is the Homebrew tap's: a
# GitHub App's key, held by the `release` environment and used by the `tap`
# job alone, to mint a token good for an hour and for one repository (#27).
#
# Built where nothing can be published, published where nothing is built
# (#19): `archives` and `image-build` run GoReleaser, `make ui`, `npm ci` and
# buildx with read access alone and hand their outputs over as artifacts;
# `release`, `image` and `tap` hold the write scopes and only attest, upload
# and commit what they were handed — no checkout, no toolchain, no install.
#
# Nothing here runs on `main`. The tag is the one act the owner performs
# deliberately, and `latest` moves only with it (#6).
name: Release the server

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  # Everything that can refuse the tag, before anything is published. It is its
  # own job because `release` publishes on GitHub the moment it runs: a check
  # living in `image` would fire after the archives were already public, and a
  # half-published release is worse than a refused one.
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tags: ${{ steps.meta.outputs.tags }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      latest: ${{ steps.meta.outputs.latest }}
      previous: ${{ steps.meta.outputs.previous }}
      line: ${{ steps.meta.outputs.line }}
    steps:
      # Tags and all of them: which image tags this release may move is a
      # question about the ones already published (#16).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The tag, and the image tags it moves
        id: meta
        run: |
          version="${GITHUB_REF_NAME#v}"
          # A tag that is not a version would otherwise publish an image named
          # after it. A tag on GHCR is as public as a version on PyPI. Two
          # shapes pass — vX.Y.Z and vX.Y.Z-(alpha|beta|rc).N — and the script
          # says which; `v0.1.0rc1`, `v0.1.0-` and `v1.0.0+build` are refused,
          # where a glob took them for stable releases (#27).
          kind="$(scripts/release-tag.sh "$GITHUB_REF_NAME")"

          image="ghcr.io/${GITHUB_REPOSITORY}"
          tags="$image:$version"
          # The GitHub release follows the image: marked a pre-release when it
          # is one, and Latest only when `latest` moves with it.
          prerelease=false
          latest=false

          # A pre-release publishes under its exact tag and nothing else: it is
          # for the person who asked for it, and neither `X.Y` — what an
          # operator pins to for patches but not surprises — nor `latest` is
          # that (#6).
          case "$kind" in
            prerelease)
              echo "pre-release: publishing $version alone"
              prerelease=true
              ;;
            stable)
              # A moving tag may only move forward. Releasing a back-patch
              # (v0.2.5 after v0.3.0) must not walk `latest` backwards onto an
              # older build: that is a silent downgrade for everyone tracking
              # it, and it lands them in the older-binary-newer-schema case
              # docs/docker.md says is not supported (#16).
              #
              # Only stable tags are compared, by the shape and not by the
              # lack of a dash: git's version sort puts `v0.3.0-rc.1` *after*
              # `v0.3.0`, and a tag that is no release at all (`v0.3.0+x`,
              # pushed before #27 refused them) must not be the newest.
              newest="$(git tag --list 'v[0-9]*' --sort=-v:refname |
                        awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/' | head -1)"
              line="v${version%.*}"
              newest_on_line="$(git tag --list "$line.[0-9]*" --sort=-v:refname |
                                awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/' | head -1)"

              if [ "$newest_on_line" = "$GITHUB_REF_NAME" ]; then
                tags="$tags,$image:${version%.*}"
              else
                echo "not moving ${version%.*}: $newest_on_line is newer on that line"
              fi

              if [ "$newest" = "$GITHUB_REF_NAME" ]; then
                tags="$tags,$image:latest"
                latest=true
              else
                echo "not moving latest: $newest is newer"
              fi
              ;;
          esac

          # The release notes run from the server tag before this one in its
          # own history — not from GitHub's newest release, which for a
          # back-patch is a later line. A stable release counts from the
          # stable one before it, so its notes cover the release candidates
          # too; the first tag has nothing to count from.
          exclude=()
          [ "$prerelease" = true ] || exclude=(--exclude 'v*-*')
          previous="$(git describe --tags --abbrev=0 --match 'v[0-9]*' \
                        "${exclude[@]}" "$GITHUB_REF_NAME^" 2>/dev/null || true)"
          echo "notes from: ${previous:-the beginning}"

          echo "publishing: $tags"
          {
            echo "version=$version"
            echo "tags=$tags"
            echo "prerelease=$prerelease"
            echo "latest=$latest"
            echo "previous=$previous"
            echo "line=v${version%.*}"
          } >> "$GITHUB_OUTPUT"

  # The six archives and their checksums, with no way to publish them: GoReleaser
  # builds with `--skip=publish`, and `release` below puts them on GitHub.
  archives:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # `.goreleaser.yaml` runs `make ui` before the matrix: every official
      # artifact carries the web interface (spec 006 #9), and a build without
      # the tag would silently ship the stub page.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ui/package.json
          package-manager-cache: false # a release restores no cache another run could have written
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "v2.18.2"
          args: release --clean --skip=publish
        env:
          # The server's tag, named rather than found: the repository carries
          # the SDKs' tags too (`sdk/go/vX.Y.Z`, `sdk-py/v…`, `sdk-js/v…`), and
          # when two sit on one commit GoReleaser would pick between them by
          # itself. `check` has already refused any tag that is not vX.Y.Z or
          # vX.Y.Z-(alpha|beta|rc).N (scripts/release-tag.sh).
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archives
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 1
      # The Homebrew formula GoReleaser wrote beside the archives, with their
      # checksums in it and nothing pushed (`skip_upload`). `tap` commits it.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: formula
          path: dist/homebrew/Formula/tracepad.rb
          if-no-files-found: error
          retention-days: 1

  # The multi-arch image as an OCI archive, pushed nowhere. No QEMU: both
  # builder stages run on the build platform and cross-compile (Dockerfile,
  # #10), and the runtime stage only copies — so nothing in this build ever
  # executes an arm64 binary.
  image-build:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # No BuildKit provenance and no build record: both embed the tag push's
      # event payload. The image's provenance is `image`'s attestation (#19).
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          provenance: false
          outputs: type=oci,dest=${{ runner.temp }}/image.tar
          build-args: |
            VERSION=${{ needs.check.outputs.version }}
            REVISION=${{ github.sha }}
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image
          path: ${{ runner.temp }}/image.tar
          if-no-files-found: error
          retention-days: 1

  # Publishes only once both builds exist: an image that does not build refuses
  # the tag before the archives are public.
  release:
    needs: [check, archives, image-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release and its files
      id-token: write # signing the archives' provenance
      attestations: write # storing it
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: archives
          path: dist
      - uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      # Left to itself GitHub marks every new release Latest: a release
      # candidate, or a back-patch published after a newer line, would take
      # the badge — and the download link — from the newest stable (#16).
      - name: The release, with the archives and their checksums
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
          LATEST: ${{ needs.check.outputs.latest }}
          PREVIOUS: ${{ needs.check.outputs.previous }}
        run: |
          since=()
          [ -z "$PREVIOUS" ] || since=(--notes-start-tag "$PREVIOUS")
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes "${since[@]}" \
            --prerelease="$PRERELEASE" --latest="$LATEST" dist/*

  image:
    needs: [check, image-build, release]
    runs-on: ubuntu-latest
    permissions:
      packages: write # the image and its attestation on GHCR
      id-token: write # signing the image's provenance
      attestations: write # storing it
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image
          path: ${{ runner.temp }}
      # Every tag decided in `check`, before the release was published, points
      # at the one index the archive holds; skopeo is on the runner image. The
      # login goes into Docker's config file rather than skopeo's own, because
      # the attestation below is pushed with whatever credentials that file
      # holds — skopeo reads it just the same.
      - name: Push the archive under each tag
        id: push
        env:
          TAGS: ${{ needs.check.outputs.tags }}
          GH_TOKEN: ${{ github.token }}
        run: |
          export REGISTRY_AUTH_FILE="$HOME/.docker/config.json"
          mkdir -p "$HOME/.docker"
          skopeo login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$GH_TOKEN"
          for tag in ${TAGS//,/ }; do
            skopeo copy --all --preserve-digests --digestfile "$RUNNER_TEMP/digest" \
              "oci-archive:$RUNNER_TEMP/image.tar" "docker://$tag"
          done
          echo "digest=$(cat "$RUNNER_TEMP/digest")" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # The documentation for this release (spec 050 #6), under `vX.Y` — the line,
  # not the patch: a back-patch replaces its line's pages. `latest` moves with
  # it exactly when the image's does. A pre-release has no docs of its own;
  # `dev` is where its docs are. After `release`, so that a tag that refuses
  # to publish does not leave docs for a release nobody can download; and not
  # a gate of anything, so that a docs failure cannot hold an image back.
  # The scope is this job's alone: site.yml builds with read access and
  # publishes with the write scope in a job of its own.
  docs:
    needs: [check, release]
    if: needs.check.outputs.prerelease != 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/site.yml
    with:
      version: ${{ needs.check.outputs.line }}
      alias: ${{ needs.check.outputs.latest == 'true' && 'latest' || '' }}

  # The Homebrew tap (#27). It runs only for a release that moves `latest`: a
  # pre-release is for the person who asked for it, and a back-patch must not
  # walk `brew upgrade` backwards, the downgrade #16 refuses for the image.
  # After `release`, because the formula names URLs that must exist and checksums
  # of files that must be the ones published.
  #
  # The App's key is an environment secret, so this is the only job that can
  # read it, and the job's own `GITHUB_TOKEN` is empty: the credential is an
  # installation token for `homebrew-tap` alone, contents only, revoked when
  # the job ends. The commit goes through the contents API, so there is no
  # clone and nothing to run but `gh`.
  #
  # One at a time, and none cancelled: two tags close together would otherwise
  # read the same blob and the second PUT would fail on a stale sha. And the
  # tap only moves forward: a manual re-run of an older release's `tap` job
  # passes `if` on the `latest` that run computed, so the step below compares
  # the version already in the tap with the one it holds.
  tap:
    needs: [check, release]
    if: needs.check.outputs.latest == 'true'
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: tap
      cancel-in-progress: false
    permissions: {}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: formula
          path: formula
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          client-id: ${{ vars.TAP_APP_CLIENT_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap
          permission-contents: write
      - name: Commit the formula to the tap
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ needs.check.outputs.version }}
          TAP: ${{ github.repository_owner }}/homebrew-tap
        run: |
          set -euo pipefail
          path=Formula/tracepad.rb
          err="$RUNNER_TEMP/lookup.err"

          # What the tap holds now. Only "there is no such file" means the first
          # release; a 5xx, a rate limit or a token that cannot read the
          # repository is not that, and is not read as that: the PUT would go
          # out without a sha and fail on a 422 that names the wrong cause.
          sha=""
          if current="$(gh api "repos/$TAP/contents/$path" 2>"$err")"; then
            sha="$(jq -r .sha <<< "$current")"
            jq -r .content <<< "$current" | base64 -d > "$RUNNER_TEMP/current.rb"
            have="$(sed -n 's/^  version "\(.*\)"$/\1/p' "$RUNNER_TEMP/current.rb" | head -1)"
            if [ -z "$have" ]; then
              echo "::error::$TAP has a $path with no version line; not replacing what cannot be read"
              exit 1
            fi
            if cmp -s formula/tracepad.rb "$RUNNER_TEMP/current.rb"; then
              echo "::notice::$TAP is already at $VERSION, with this formula"
              exit 0
            fi
            # Only stable versions reach the tap, so `sort -V` orders them.
            newest="$(printf '%s\n%s\n' "$have" "$VERSION" | sort -V | tail -1)"
            if [ "$have" != "$VERSION" ] && [ "$newest" = "$have" ]; then
              echo "::notice::$TAP is at $have, newer than $VERSION; leaving it"
              exit 0
            fi
          elif grep -q 'HTTP 404' "$err"; then
            echo "$TAP has no $path yet: the first release"
          else
            echo "::error::could not read $path from $TAP:"
            cat "$err" >&2
            exit 1
          fi

          # An update names the blob it replaces; the first release has none.
          args=(-f "message=tracepad $VERSION" -f "content=$(base64 < formula/tracepad.rb | tr -d '\n')")
          [ -z "$sha" ] || args+=(-f "sha=$sha")
          gh api --method PUT "repos/$TAP/contents/$path" "${args[@]}"
