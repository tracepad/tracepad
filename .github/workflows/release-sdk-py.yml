# Publishing the Python package (spec 017 #12).
#
# The tag is the trigger and the version is the package's own: `sdk-py/v0.2.0`
# releases what `sdk/python/src/tracepad/_config.py` calls 0.2.0, and a tag
# that says anything else fails before a build happens — a version on PyPI
# cannot be taken back.
#
# Credentials: none. PyPI trusted publishing exchanges this workflow's OIDC
# token for an upload token, so there is no API token in the repository to
# leak or to rotate. The publisher (owner `tracepad`, repository `tracepad`,
# workflow `release-sdk-py.yml`, environment `pypi`) is configured once on
# PyPI by the project's owner.
#
# Two jobs, and only the second can mint that token (spec 017 #20): `build`
# installs, tests and builds from `uv.lock` with read access alone, and
# `publish` receives the two files it made and uploads them — it runs no code
# of the package's and installs nothing but a pinned uv.
name: Release the Python package

on:
  push:
    tags: ["sdk-py/v*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.12"
          python-version: "3.13"
          enable-cache: false

      - name: The tag and the package must agree about the version
        run: |
          tagged="${GITHUB_REF_NAME#sdk-py/v}"
          declared="$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' sdk/python/src/tracepad/_config.py)"
          if [ "$tagged" != "$declared" ]; then
            echo "tag says $tagged, the package says $declared" >&2
            exit 1
          fi

      # The suite runs here too. CI ran it on the commit, but a tag can be
      # moved, and what is published must be what passed — on the lock, not on
      # whatever the index serves today.
      - run: uv sync --locked
        working-directory: sdk/python
      - run: SDK_PYTHON="$PWD/sdk/python/.venv/bin/python" SDK_SKIP_E2E=1 scripts/sdk-test.sh

      # hatchling is held to one version by `[tool.uv]` in pyproject.toml.
      - run: uv build --out-dir "$RUNNER_TEMP/dist"
        working-directory: sdk/python
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.12"
          enable-cache: false
      - run: uv publish --trusted-publishing always dist/*
