# Publishing the Python package (spec 017 #12).
#
# The tag is the trigger and the version is the package's own: `sdk-py/v0.2.0`
# releases what `sdk/python/src/tracepad/_config.py` calls 0.2.0, and a tag
# that says anything else fails before a build happens — a version on PyPI
# cannot be taken back. The version is read from the tag that triggered the
# run (`GITHUB_REF_NAME`), never from `git describe`: a commit may carry the
# server's tag and the other packages' beside this one (spec 020 #28).
#
# Credentials: none. PyPI trusted publishing exchanges this workflow's OIDC
# token for an upload token, so there is no API token in the repository to
# leak or to rotate. The publisher (owner `tracepad`, repository `tracepad`,
# workflow `release-sdk-py.yml`, environment `pypi`) is configured once on
# PyPI by the project's owner.
#
# Two jobs, and only the second can mint that token (spec 017 #20): `build`
# installs from `uv.lock`, builds against hashed build constraints and tests
# what it built, with read access alone, and `publish` receives the two files
# it made and uploads them — it runs no code of the package's and installs
# nothing but a pinned uv.
name: Release the Python package

on:
  push:
    tags: ["sdk-py/v*"]

permissions: {}

# The same uv CI tests the package with. Dependabot does not move it; spec 020
# #19 lists the pins moved by hand.
env:
  UV_VERSION: "0.11.12"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
          enable-cache: false

      # The tag spells a pre-release as semver does (`sdk-py/v0.2.0-rc.1`, as
      # every tag here does) and the script derives PyPI's spelling of it
      # (`0.2.0rc1`, PEP 440) to hold the package to.
      - name: The tag and the package must agree about the version
        run: scripts/sdk-py-release-check.sh "$GITHUB_REF_NAME"

      # The test dependencies from the lock, and not the package: building it
      # editable here would run the build backend outside the constraints
      # below, the ones that hold it by hash.
      - run: uv sync --locked --no-install-project
        working-directory: sdk/python
      # The backend and everything it imports, by version and by hash: a lock
      # covers what the package installs, not what builds it.
      - run: >-
          uv build --out-dir "$RUNNER_TEMP/dist"
          --build-constraints build-constraints.txt --require-hashes
        working-directory: sdk/python

      # The suite runs here too, on the wheel about to be published. CI ran it
      # on the commit, but a tag can be moved, and what is published must be
      # what passed — on the lock, not on whatever the index serves today.
      - run: uv pip install --python sdk/python/.venv/bin/python --no-deps "$RUNNER_TEMP"/dist/*.whl
      - run: SDK_PYTHON="$PWD/sdk/python/.venv/bin/python" SDK_SKIP_E2E=1 scripts/sdk-test.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - run: uv publish --trusted-publishing always dist/*
