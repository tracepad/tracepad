name: Fuzz

# Every Go fuzz target for a while each (spec 052 #4): by hand, from the Actions
# tab, and not on a schedule. The ingest decoders are the surface that takes
# strangers' bytes, and a few minutes a target finds what ten seconds in
# `make fuzz` does not — but a nightly run of fourteen targets costs most of an
# hour a night for a result that changes only when the decoders do, so it
# waits for the repository to be public and for someone to want the nights.
# One line turns it on: a `schedule:` trigger here.
on:
  workflow_dispatch:
    inputs:
      fuzztime:
        description: Time for each target, as `go test -fuzztime` reads it (3m, 10s, 5000x)
        default: 3m
        required: true
      target:
        description: Only the targets whose name matches this regular expression
        default: .
        required: true

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The inputs reach the script as environment, not as text pasted into
      # the command: they are typed by whoever presses the button.
      - run: scripts/fuzz.sh "$TARGET"
        env:
          FUZZTIME: ${{ inputs.fuzztime }}
          TARGET: ${{ inputs.target }}
          FUZZ_PARALLEL: 4
      # A crash leaves its input beside the package; this is the way to get it
      # off the runner and into a commit with its fix.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: fuzz-crashers
          path: internal/**/testdata/fuzz/
          retention-days: 14
