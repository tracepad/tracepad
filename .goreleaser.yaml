# Release configuration. Runs on version tags (v*) in release-server.yml, as
# `release --skip=publish`; `goreleaser check` validates this file.
version: 2

project_name: tracepad

# Every official artifact carries the web interface (spec 006 #9). The bundle
# is built once, before the matrix, and staged where the `ui` build tag embeds
# it; a build without the tag would silently ship the stub page.
before:
  hooks:
    - make ui
    # After the bundle: its list of npm packages is half of the file (spec 020 #17).
    - make notices

builds:
  - main: ./cmd/tracepad
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    tags: [ui]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # Listed explicitly rather than left to the defaults: Apache-2.0 §4(d)
    # requires NOTICE to travel with every distribution, and it is not one
    # of the files GoReleaser picks up on its own; THIRD_PARTY_NOTICES is the
    # licences of what the binary compiles in and bundles.
    files:
      - LICENSE
      - NOTICE
      - THIRD_PARTY_NOTICES
      - README.md
      - third_party/**/*

checksum:
  name_template: checksums.txt

# GoReleaser builds and no longer publishes (spec 020 #19): the release and its
# notes are `gh release create --generate-notes` in release-server.yml.
changelog:
  disable: true
