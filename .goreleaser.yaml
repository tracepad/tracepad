# Release configuration. Runs on version tags (v*) in release-server.yml, as
# `release --skip=publish`. `goreleaser check` reports `brews` as deprecated and
# exits 1 on it (spec 020 #27); `goreleaser release --snapshot --clean` is the
# rehearsal that validates this file.
version: 2

project_name: tracepad

# Every official artifact carries the web interface (spec 006 #9). The bundle
# is built once, before the matrix, and staged where the `ui` build tag embeds
# it; a build without the tag would silently ship the stub page.
before:
  hooks:
    - make ui
    # After the bundle: its list of npm packages is half of the file (spec 020 #17).
    - make notices

builds:
  - main: ./cmd/tracepad
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    tags: [ui]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    # Named here so that docs/install.md can say what the files are called:
    # tracepad_0.1.0_linux_amd64.tar.gz, and .zip on Windows. This is GoReleaser
    # 2's own default spelled out, variant suffixes included, so a target that
    # gains a variant later gets a new name by the same rule, not a collision.
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}{{ with .Mips }}_{{ . }}{{ end }}{{ if not (eq .Amd64 "v1") }}{{ .Amd64 }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    # Listed explicitly rather than left to the defaults: Apache-2.0 §4(d)
    # requires NOTICE to travel with every distribution, and it is not one
    # of the files GoReleaser picks up on its own; THIRD_PARTY_NOTICES is the
    # licences of what the binary compiles in and bundles.
    files:
      - LICENSE
      - NOTICE
      - THIRD_PARTY_NOTICES
      - README.md
      # The README's header is a <picture> of these two (spec 006 #30); without
      # them the archive's copy opens on a broken image.
      - docs/assets/mark-on-*.svg
      - third_party/**/*

checksum:
  name_template: checksums.txt

# GoReleaser builds and no longer publishes (spec 020 #19): the release and its
# notes are `gh release create --generate-notes` in release-server.yml.
changelog:
  disable: true

# The Homebrew tap (spec 020 #27). A formula, not a cask: the binary is not
# notarized, a cask's download carries the quarantine mark and Gatekeeper
# refuses it, and a formula's does not. GoReleaser writes the formula into
# `dist/` and pushes nothing (`skip_upload`): the release workflow's build half
# has no token, and its `tap` job commits the finished file with a short-lived
# App token, without a checkout or a toolchain.
brews:
  - name: tracepad
    # The owner and the repository come from the run, as the workflow's `tap`
    # job takes the tap's owner from `github.repository_owner`: one source for
    # one fact, so a fork or a renamed organisation moves both. The defaults
    # are for a local snapshot, where Actions' variables are not set.
    repository:
      owner: '{{ envOrDefault "GITHUB_REPOSITORY_OWNER" "tracepad" }}'
      name: homebrew-tap
    directory: Formula
    homepage: 'https://github.com/{{ envOrDefault "GITHUB_REPOSITORY" "tracepad/tracepad" }}'
    description: Lightweight, self-hosted, OTLP-native store and viewer for LLM and agent traces
    license: Apache-2.0
    skip_upload: true
    test: |
      assert_match version.to_s, shell_output("#{bin}/tracepad version")
