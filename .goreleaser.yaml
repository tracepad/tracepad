# Release configuration. Runs on version tags (v*) via release workflow
# (added in the packaging stage); `goreleaser check` validates this file.
version: 2

project_name: tracepad

builds:
  - main: ./cmd/tracepad
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # Listed explicitly rather than left to the defaults: Apache-2.0 §4(d)
    # requires NOTICE to travel with every distribution, and it is not one
    # of the files GoReleaser picks up on its own.
    files:
      - LICENSE
      - NOTICE
      - README.md
      - third_party/**/*

checksum:
  name_template: checksums.txt

changelog:
  use: github
